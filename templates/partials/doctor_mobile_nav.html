<a href="{% url 'doctor_dashboard' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'doctor_dashboard' %}text-primary-600{% else %}text-gray-500{% %}">
  <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Home
</a>
<a href="{% url 'doctor_appointments' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if 'appointment' in request.resolver_match.url_name %}text-primary-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="calendar-check" class="w-5 h-5"></i> Appts
</a>
<a href="{% url 'doctor_calendar' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'doctor_calendar' %}text-primary-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="calendar" class="w-5 h-5"></i> Calendar
</a>
<a href="{% url 'doctor_patients' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if 'patient' in request.resolver_match.url_name %}text-primary-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="users" class="w-5 h-5"></i> Patients
</a>
<a href="{% url 'notification_list' %}" class="relative flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'notification_list' %}text-primary-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="bell" class="w-5 h-5"></i> Alerts
  {% if unread_notifications_count %}<span class="absolute top-0 right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">{{ unread_notifications_count }}</span>{% endif %}
</a>
