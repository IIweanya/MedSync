<a href="{% url 'patient_dashboard' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'patient_dashboard' %}text-teal-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Home
</a>
<a href="{% url 'find_doctor' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'find_doctor' or request.resolver_match.url_name == 'book_appointment' %}text-teal-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="calendar-plus" class="w-5 h-5"></i> Book
</a>
<a href="{% url 'patient_appointments' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if 'appointment' in request.resolver_match.url_name %}text-teal-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="calendar-check" class="w-5 h-5"></i> Appts
</a>
<a href="{% url 'patient_calendar' %}" class="flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'patient_calendar' %}text-teal-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="calendar" class="w-5 h-5"></i> Calendar
</a>
<a href="{% url 'notification_list' %}" class="relative flex flex-col items-center gap-1 py-1 px-3 text-xs font-medium {% if request.resolver_match.url_name == 'notification_list' %}text-teal-600{% else %}text-gray-500{% endif %}">
  <i data-lucide="bell" class="w-5 h-5"></i> Alerts
  {% if unread_notifications_count %}<span class="absolute top-0 right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">{{ unread_notifications_count }}</span>{% endif %}
</a>
