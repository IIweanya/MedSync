{% extends "base.html" %}
{% block title %}{% block auth_title %}Sign In{% endblock %} — MedSync{% endblock %}
{% block body %}
<div class="min-h-screen bg-gradient-to-br from-primary-50 via-white to-teal-50 flex flex-col">
  <!-- Nav -->
  <div class="p-4 flex items-center justify-between max-w-7xl mx-auto w-full">
    <a href="{% url 'core:landing' %}" class="flex items-center gap-2">
      <img src="/static/images/medsync_logo.png" alt="MedSync" class="h-8 w-auto" />
      <span class="font-semibold text-gray-900">MedSync</span>
    </a>
    {% block auth_nav_extra %}{% endblock %}
  </div>

  <!-- Card -->
  <div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      {% block auth_card %}{% endblock %}
    </div>
  </div>

  <footer class="text-center py-6 text-xs text-gray-400">
    © 2026 MedSync. All rights reserved.
  </footer>
</div>
{% endblock %}
