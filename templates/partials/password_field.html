{% comment %}
   Password field — label, input, in-input visibility toggle, error slot.

   The toggle is a <button type="button"> absolutely positioned inside the
   .password-input-wrapper (req1 §4), never beside the input, and pr-11 on the
   input keeps typed text clear of the icon. Click behaviour lives in the single
   delegated handler in base.html.

   Usage:
     {% include "partials/password_field.html" with id="pwd" name="password" label="Password" placeholder="Create a strong password" autocomplete="new-password" errors=form.password.errors %}

   Optional: autofocus, hint, autocomplete (defaults to current-password).
{% endcomment %}
<div class="form-field">
  <label for="{{ id }}" class="form-label">{{ label }}</label>
  <div class="password-input-wrapper">
    <input type="password"
           name="{{ name }}"
           id="{{ id }}"
           class="form-input pr-11{% if errors %} input-error{% endif %}"
           placeholder="{{ placeholder|default:'' }}"
           autocomplete="{{ autocomplete|default:'current-password' }}"
           {% if errors %}aria-invalid="true"{% endif %}
           {% if errors or hint %}aria-describedby="{{ id }}-msg"{% endif %}
           {% if autofocus %}autofocus{% endif %}
           required />
    <button type="button"
            class="password-toggle"
            data-password-toggle
            aria-controls="{{ id }}"
            aria-pressed="false"
            aria-label="Show password">
      <i data-lucide="eye" class="w-4 h-4 pointer-events-none"></i>
    </button>
  </div>
  {% if errors %}
    <p class="form-error" id="{{ id }}-msg">
      <i data-lucide="alert-circle" class="w-3.5 h-3.5 flex-shrink-0 mt-px"></i>
      <span>{{ errors.0 }}</span>
    </p>
  {% elif hint %}
    <span class="form-hint" id="{{ id }}-msg">{{ hint }}</span>
  {% endif %}
</div>
